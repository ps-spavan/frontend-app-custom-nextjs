# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
  path_instructions:
    - path: "src/**/*.ts"
      instructions: |
        Review the TypeScript code against the Google TypeScript style guide and point out any mismatches.
        Flag any variables that are declared but never read.
        Review all standard lint errors from @eslint/eslintrc.
chat:
  auto_reply: true
